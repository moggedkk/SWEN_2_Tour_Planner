<app-navbar></app-navbar>
<app-tour-actions></app-tour-actions>



<div class="container mt-4">
  <form #tourFormElement="ngForm" (ngSubmit)="onSubmit()" class="needs-validation">
    <div class="mb-3">
      <label for="tourName" class="form-label">Tour Name <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        id="tourName"
        name="name"
        [(ngModel)]="tourForm.name"
        required
        minlength="3"
        maxlength="100">
      <div class="form-text">Must be 3-100 characters</div>
    </div>

    <div class="mb-3">
      <label for="tourStart" class="form-label">Start Location <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        id="tourStart"
        name="start"
        [(ngModel)]="tourForm.start"
        required
        minlength="2">
    </div>

    <div class="mb-3">
      <label for="tourEnd" class="form-label">End Location <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        id="tourEnd"
        name="end"
        [(ngModel)]="tourForm.end"
        required
        minlength="2">
    </div>

    <div class="mb-3">
      <label for="tourDifficulty" class="form-label">Difficulty <span class="text-danger">*</span></label>
      <select
        class="form-select"
        id="tourDifficulty"
        name="difficulty"
        [(ngModel)]="tourForm.difficulty"
        required>
        <option value="">Select difficulty</option>
        <option value="Easy">Easy</option>
        <option value="Moderate">Moderate</option>
        <option value="Challenging">Challenging</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="tourDescription" class="form-label">Description <span class="text-danger">*</span></label>
      <textarea
        class="form-control"
        id="tourDescription"
        name="description"
        rows="3"
        [(ngModel)]="tourForm.description"
        required
        minlength="10"
        maxlength="500"></textarea>
      <div class="form-text">Must be 10-500 characters</div>
    </div>

    <div class="mb-3">
      <label for="tourTransportType" class="form-label">Transport Type <span class="text-danger">*</span></label>
      <select
        class="form-select"
        id="tourTransportType"
        name="transportType"
        [(ngModel)]="tourForm.transportType"
        required>
        <option *ngFor="let type of transportTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!tourFormElement.form.valid">
      Create Tour
    </button>
  </form>
</div>
