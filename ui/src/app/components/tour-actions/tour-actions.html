<div class="container mt-4">
  <ul class="nav nav-tabs justify-content-center">
    <li class="nav-item">
      <a class="nav-link"
         routerLink="/createtours"
         routerLinkActive="active">
        Create
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link"
         routerLink="/import"
         routerLinkActive="active">
        Import
      </a>
    </li>
  </ul>
</div>
<div class="container mt-4">
  <form #tourFormElement="ngForm" (ngSubmit)="onSubmit()" class="needs-validation">
    <div class="mb-3">
      <label for="tourName" class="form-label">Tour Name</label>
      <input
        type="text"
        class="form-control"
        id="tourName"
        name="name"
        [(ngModel)]="tourForm.name"
        required>
    </div>

    <div class="mb-3">
      <label for="tourStart" class="form-label">Start Location</label>
      <input
        type="text"
        class="form-control"
        id="tourStart"
        name="start"
        [(ngModel)]="tourForm.start"
        required>
    </div>

    <div class="mb-3">
      <label for="tourEnd" class="form-label">End Location</label>
      <input
        type="text"
        class="form-control"
        id="tourEnd"
        name="end"
        [(ngModel)]="tourForm.end"
        required>
    </div>

    <div class="mb-3">
      <label for="tourDifficulty" class="form-label">Difficulty</label>
      <select
        class="form-select"
        id="tourDifficulty"
        name="difficulty"
        [(ngModel)]="tourForm.difficulty"
        required>
        <option value="">Select difficulty</option>
        <option value="Easy">Easy</option>
        <option value="Moderate">Moderate</option>
        <option value="Challenging">Challenging</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="tourDescription" class="form-label">Description</label>
      <textarea
        class="form-control"
        id="tourDescription"
        name="description"
        rows="3"
        [(ngModel)]="tourForm.description"
        required></textarea>
    </div>

    <div class="mb-3">
      <label for="tourTransportType" class="form-label">Transport Type</label>
      <select
        class="form-select"
        id="tourTransportType"
        name="transportType"
        [(ngModel)]="tourForm.transportType"
        required>
        <option *ngFor="let type of transportTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <div class="mb-3">
      <label for="tourDistance" class="form-label">Distance (km)</label>
      <input
        type="number"
        class="form-control"
        id="tourDistance"
        name="distance"
        [(ngModel)]="tourForm.distance"
        min="0"
        step="0.1">
    </div>

    <div class="mb-3">
      <label for="tourEstimatedTime" class="form-label">Estimated Time (minutes)</label>
      <input
        type="number"
        class="form-control"
        id="tourEstimatedTime"
        name="estimatedTime"
        [(ngModel)]="tourForm.estimatedTime"
        min="0">
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!tourFormElement.form.valid">
      Create Tour
    </button>
  </form>
</div>
