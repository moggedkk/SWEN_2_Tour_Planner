spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/tour_planner
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# secrets read from env — set OPENROUTESERVICE_APIKEY before starting the app
openrouteservice.apiKey=${OPENROUTESERVICE_APIKEY:}

# where uploaded log images live (relative to the working dir of the running app)
storage.image-dir=./images

# cap the inbound JSON body so a base64 image bomb can't OOM us
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
