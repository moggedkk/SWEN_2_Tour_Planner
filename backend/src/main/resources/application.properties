spring.application.name=backend

# DB connection — env vars (from .env, loaded by compose or the IntelliJ EnvFile plugin) win, defaults are a fallback so a bare IntelliJ run still boots
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:tour_planner}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# secrets — must be provided via env (no defaults so we fail loud instead of booting with a blank key)
openrouteservice.apiKey=${OPENROUTESERVICE_APIKEY}
jwt.secret=${JWT_SECRET}

# where uploaded log images live (relative to the working dir of the running app)
storage.image-dir=./images

# cap the inbound JSON body so a base64 image bomb can't OOM us
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
